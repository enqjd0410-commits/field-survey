<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>토목지장물 현장조사 입력</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--line:#d9d6cc;--tx:#1f1e1c;--mut:#6b6a65;--todo:#d9622b;--ok:#3f8f1f;--new:#7b4fd6;--sel:#f0a020}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--line:#3d3c39;--tx:#eceae4;--mut:#a3a19a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px;cursor:pointer}
button:active{transform:scale(.98)}
button.pri{background:var(--ok);border-color:var(--ok);color:#fff}
button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:40px;padding:6px 12px}
.prog{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0}
.sync{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--bg);color:var(--mut)}
.sync.bad{color:#a35b00}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:10px;padding:10px;height:calc(100vh - 62px)}
@media (max-width:860px){.main{grid-template-columns:1fr;height:auto}.mapbox{height:56vh}}
.mapbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
svg#map{width:100%;height:100%;display:block;user-select:none}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{min-width:48px;padding:4px}
.legend{position:absolute;left:8px;bottom:8px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--tx)}
.lg{display:flex;align-items:center;gap:8px;padding:2px 0;white-space:nowrap}
.lg svg{flex:0 0 auto}
.segbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:6px;align-items:center;background:var(--card);border:2px solid #e0218a;border-radius:10px;padding:6px 8px;font-size:13px;z-index:4;max-width:96%;flex-wrap:wrap;justify-content:center}
.segbar button{min-height:38px;padding:4px 10px}
.phw{position:relative;display:inline-block}
.phx{position:absolute;top:-8px;right:-8px;min-height:0;width:28px;height:28px;padding:0;border-radius:14px;background:#fff;border:1px solid #c0392b;color:#c0392b;font-size:13px;line-height:1}
.phx.on{width:auto;padding:0 6px;background:#c0392b;color:#fff}
.mapctl .tg{color:#999}
.mapctl .tg.on{color:#fff;background:#e8590c;border-color:#e8590c}
.addhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--sel);color:#000;border-radius:8px;padding:6px 12px;font-size:13px;display:none}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.list{flex:1;overflow:auto;min-height:160px;padding:0}
.lhead{padding:8px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.row.sel{background:color-mix(in srgb,var(--sel) 18%,transparent)}
.row .st{color:var(--mut);font-size:12px;white-space:nowrap}
.row.done .st{color:var(--ok)}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.h b{font-size:19px;font-weight:600}
.spec{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--mut)}
label.f input,label.f select{margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;min-height:38px;background:var(--card)}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.photos img,.photos .ph{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos .ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);text-align:center}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1}
.err{color:#c0392b;font-size:13px;min-height:16px}
.empty{color:var(--mut);padding:20px;text-align:center}
.lbl{fill:var(--tx);paint-order:stroke;stroke:var(--card)}
.sk{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.sk .tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--card);align-items:center}
.sk .tb button{min-height:40px;padding:4px 10px}
.sk .tb .sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;min-height:0}
.sk .tb .sw.on{outline:3px solid var(--sel)}
.sk canvas{flex:1;width:100%;touch-action:none;background:#fff;display:block}
.shape{width:100%;height:150px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:20}
.modal .card{max-width:520px;width:92%;max-height:80vh;overflow:auto}
</style>
</head>
<body>
<div class="top">
  <input id="q" placeholder="번호 검색 (예: 측구(12))" style="width:210px">
  <div class="seg" id="fSeg"><button data-f="all">전체</button><button data-f="todo">미조사</button><button data-f="done">완료</button><button data-f="new">신규</button></div>
  <select id="kindSel" style="width:auto;min-width:120px"></select>
  <div class="prog"><span id="progTxt">-</span><div class="bar"><i id="progBar"></i></div></div>
  <span class="sync" id="sync">연결 확인 중…</span>
  <button id="whoBtn">입력자: -</button><button id="exportBtn">결과 시트 열기</button>
</div>
<div class="main">
  <div class="mapbox">
    <svg id="map"><g id="vp"><g id="gbg"></g><g id="gitems"></g><g id="gjigu" pointer-events="none"></g><g id="glabels"></g><g id="gme"></g></g></svg>
    <div class="mapctl"><button id="zin" aria-label="확대">＋</button><button id="zout" aria-label="축소">－</button><button id="zfit">전체</button><button id="gpsBtn">📍 현위치</button><button id="addBtn">＋신규</button><button id="jiguBtn" class="tg on">지구계 ON</button></div>
    <div class="segbar" id="segBar"><span id="segTxt"></span><button id="segU">되돌리기</button><button id="segX">취소</button><button id="segOk" class="pri">구간 확정</button></div>
    <div class="addhint" id="addHint">도면에서 새 지장물 위치를 누르세요</div>
    <div class="legend" id="legend"><button id="legBtn" style="min-height:32px;padding:2px 10px;font-size:12px">범례 ▾</button><div id="legBody" style="display:none;margin-top:6px;max-height:46vh;overflow:auto"></div></div>
  </div>
  <div class="side">
    <div class="card" id="form"><div class="empty">도면의 점이나 아래 목록에서 지장물을 고르세요.<br>도면에 없는 지장물은 ＋신규를 누르고 위치를 찍으세요.</div></div>
    <div class="card list"><div class="lhead" id="lhead">화면 안 지장물</div><div id="list"></div></div>
  </div>
</div>
<div class="sk" id="sk"><div class="tb">
  <b id="skTitle" style="margin-right:6px"></b>
  <button class="sw on" data-c="#111" style="background:#111" aria-label="검정"></button><button class="sw" data-c="#d93a36" style="background:#d93a36" aria-label="빨강"></button><button class="sw" data-c="#2a6fd1" style="background:#2a6fd1" aria-label="파랑"></button>
  <button id="skW">굵게</button><button id="skE">지우개</button><button id="skU">되돌리기</button><button id="skC">전체 지우기</button><button id="skBg">도면 모양 끄기</button>
  <span style="flex:1"></span><button id="skX">취소</button><button id="skS" class="pri">스케치 저장</button>
</div><canvas id="skc"></canvas></div>
<div class="modal" id="login" style="display:flex"><div class="card" style="max-width:440px">
  <h3 style="margin:0 0 6px">토목지장물 현장조사</h3>
  <p class="mut" style="margin:0 0 10px">처음 한 번만 입력하면 이 태블릿에 저장됩니다.</p>
  <label class="f">서버 주소 (Apps Script 웹 앱 URL)<input id="lgUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label class="f" style="margin-top:8px">팀 암호<input id="lgKey" type="password"></label>
  <label class="f" style="margin-top:8px">입력자(팀) 이름<input id="lgWho" placeholder="1팀"></label>
  <div class="err" id="lgErr" style="margin-top:6px"></div>
  <button class="pri" id="lgGo" style="width:100%;margin-top:6px">시작</button>
</div></div>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<input type="file" id="fileIn" accept="image/*" multiple style="display:none">

(function(){
  const L=document.getElementById("login"), u=document.getElementById("lgUrl"), k=document.getElementById("lgKey"), w=document.getElementById("lgWho"), e=document.getElementById("lgErr"), go=document.getElementById("lgGo");
  u.value=CFG.url||""; k.value=CFG.key||""; try{ w.value=localStorage.getItem("fs2_who")||""; }catch(x){}
  if(DEFAULT_API_URL) u.closest("label").style.display="none";
  async function login(auto){
    const url=u.value.trim(), key=k.value, who=w.value.trim().replace(/[()\s]/g,"");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ e.textContent="서버 주소를 확인하세요 (https://script.google.com/… 로 시작)"; return; }
    if(!key){ e.textContent="팀 암호를 입력하세요"; return; }
    if(!who){ e.textContent="입력자 이름을 입력하세요"; return; }
    CFG.url=url; CFG.key=key; go.textContent="불러오는 중…"; e.textContent="";
    let data=null;
    try{ data=await apiRun("getData"); try{ localStorage.setItem("fs3_data",JSON.stringify(data)); }catch(x){} }
    catch(err){
      const cached=(()=>{ try{ return JSON.parse(localStorage.getItem("fs3_data")||"null"); }catch(x){ return null; } })();
      if(cached && auto && !/암호/.test(err.message)){ data=cached; window.__staleMsg=err.message; }
      else { e.textContent=err.message; go.textContent="시작"; return; }
    }
    try{ localStorage.setItem("fs3_url",url); localStorage.setItem("fs3_key",key); localStorage.setItem("fs2_who",who); }catch(x){}
    L.style.display="none"; START(data);
    if(window.__staleMsg){ const bn=document.createElement("div"); bn.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:40;background:#a35b00;color:#fff;padding:10px 14px;font-size:14px"; bn.textContent="⚠ 서버에서 최신 지장물 목록을 받지 못해 이 태블릿에 저장된 예전 목록("+((data.items||[]).length)+"건)으로 열었습니다. 원인: "+window.__staleMsg+"  (눌러서 닫기)"; bn.onclick=()=>bn.remove(); document.body.appendChild(bn); }
  }
  go.onclick=()=>login(false);
  [u,k,w].forEach(x=>x.addEventListener("keydown",ev=>{ if(ev.key==="Enter") login(false); }));
  if(CFG.url && CFG.key && w.value) login(true);
})();
</script>
